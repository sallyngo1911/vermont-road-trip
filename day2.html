#vtrip *{box-sizing:border-box}

#vtrip .lbl{font-family:"IBM Plex Mono",monospace;font-size:.68em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* ---------- header ---------- */
#vtrip .vt-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;margin:4px 0 22px}
#vtrip .vt-avatar{width:150px;height:150px;border-radius:50%;padding:3px;background:var(--grad)}
#vtrip .vt-avatar div{width:100%;height:100%;border-radius:50%;border:4px solid var(--bg0);background:var(--card2) center/cover no-repeat;position:relative;overflow:hidden}
#vtrip .vt-avatar div:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,rgba(233,174,69,.25),transparent 60%)}
#vtrip .vt-handle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
#vtrip .vt-handle .mono{font-size:.9em;color:var(--dusty)}
#vtrip .vt-pill{font-family:"IBM Plex Mono",monospace;font-size:.66em;letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--mustard)}
#vtrip .vt-title{font-family:"Syne","Jost",sans-serif;font-weight:800;font-size:3.1em;line-height:1;margin:0 0 8px;letter-spacing:-.01em}
#vtrip .vt-title span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#vtrip .vt-sub{color:var(--muted);margin:0 0 14px;max-width:62ch}
#vtrip .vt-stats{display:flex;gap:30px;flex-wrap:wrap}
#vtrip .vt-stats b{display:block;font-family:"Syne",sans-serif;font-weight:700;font-size:1.55em;line-height:1.1}
/* ---------- day tabs (multi-day) ---------- */
#vtrip .vt-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
#vtrip .vt-tab{padding:9px 16px;border-radius:12px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
#vtrip .vt-tab[aria-selected="true"]{border-color:var(--mustard);color:var(--text)}
#vtrip .vt-tab small{display:block;font-family:"IBM Plex Mono",monospace;font-size:.72em}
/* ---------- highlights ---------- */
#vtrip .vt-hl{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 12px;margin:0 0 16px;scrollbar-width:none}
#vtrip .vt-hl::-webkit-scrollbar{display:none}
#vtrip .vt-hlb{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:76px}
#vtrip .vt-hlb i{width:62px;height:62px;border-radius:50%;padding:2px;background:var(--line2);display:block}
#vtrip .vt-hlb[aria-pressed="true"] i{background:var(--grad)}
#vtrip .vt-hlb i span{display:flex;width:100%;height:100%;border-radius:50%;background:var(--card);border:3px solid var(--bg0);align-items:center;justify-content:center}
#vtrip .vt-hlb i svg{width:24px;height:24px}
#vtrip .vt-hlb em{font-style:normal;font-size:.76em;color:var(--muted)}
#vtrip .vt-hlb[aria-pressed="true"] em{color:var(--text)}
#vtrip .vt-hlb small{font-family:"IBM Plex Mono",monospace;font-size:.62em;color:var(--mustard);margin-top:-5px}
/* ---------- satellite hero + readouts ---------- */
#vtrip .vt-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin:0 0 16px}
#vtrip .vt-post{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:900/560;background:linear-gradient(135deg,#24313E,#3A2A1E)}
#vtrip .vt-post img,#vtrip .vt-post svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#vtrip .vt-post img{object-fit:cover;filter:saturate(1.05) contrast(1.05)}
#vtrip .vt-post .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,19,25,.1) 40%,rgba(14,19,25,.85) 100%)}
#vtrip .vt-post .hudtl{position:absolute;left:14px;top:12px;font-family:"IBM Plex Mono",monospace;font-size:.66em;letter-spacing:.1em;color:#ECE2D2;background:rgba(14,19,25,.6);backdrop-filter:blur(6px);padding:5px 9px;border-radius:8px;border:1px solid var(--line2)}
#vtrip .vt-post .hudtl i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7BE08A;margin-right:6px;box-shadow:0 0 8px #7BE08A}
#vtrip .vt-post .cap{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#vtrip .vt-post .cap b{font-family:"Syne",sans-serif;font-weight:700;font-size:1.35em;color:#FFF6E8}
#vtrip .vt-post .cap span{font-family:"IBM Plex Mono",monospace;font-size:.68em;color:var(--mustard)}
#vtrip .vt-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
#vtrip .vt-hud{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:16px;padding:12px 14px}
#vtrip .vt-hud b{display:block;font-family:"Syne",sans-serif;font-weight:700;font-size:1.35em;line-height:1.2;margin-top:2px}
#vtrip .vt-hud.hot b{color:var(--mustard)}
/* ---------- notes ---------- */
#vtrip .vt-warn{border:1px solid var(--line2);border-left:3px solid var(--mustard);background:var(--bg1);border-radius:16px;padding:16px 20px;margin:0 0 20px}
#vtrip .vt-warn h3{display:flex;align-items:center;gap:10px;font-family:"Syne",sans-serif;font-weight:700;font-size:1.05em;margin:0 0 10px}
#vtrip .vt-warn h3 svg{width:18px;height:18px;flex:0 0 auto}
#vtrip .vt-warn ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
#vtrip .vt-warn li{position:relative;padding-left:20px;color:#DCD2C2;font-size:.95em}
#vtrip .vt-warn li:before{content:"";position:absolute;left:2px;top:.55em;width:7px;height:7px;border-radius:2px;background:var(--rust);transform:rotate(45deg)}
/* ---------- map ---------- */
#vtrip .vt-mapwrap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin:0 0 22px}
#vtrip .vt-maphead{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:4px 6px 12px;font-family:"IBM Plex Mono",monospace;font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#vtrip .vt-maphead label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
#vtrip .vt-maphead input{accent-color:#D9693A;width:14px;height:14px}
#vtrip .vt-dot{display:inline-block;width:10px;height:10px;border-radius:50%}
#vtrip .vt-map{height:470px;width:100%;border-radius:14px;overflow:hidden}
#vtrip .vt-mapnote{font-family:"IBM Plex Mono",monospace;font-size:.66em;color:var(--muted);padding:10px 6px 2px}
#vtrip .vt-route{filter:drop-shadow(0 0 3px rgba(233,174,69,.9))}
/* ---------- view tabs + mode switch ---------- */
#vtrip .vt-views{display:flex;gap:2px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 18px}
#vtrip .vt-view{padding:12px 16px;font-family:"IBM Plex Mono",monospace;font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
#vtrip .vt-view[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--mustard)}
#vtrip .vt-tools{margin-left:auto;display:flex;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap}
#vtrip .vt-seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
#vtrip .vt-seg button{padding:6px 12px;border-radius:8px;font-size:.82em;color:var(--muted)}
#vtrip .vt-seg button[aria-pressed="true"]{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
#vtrip select{font-family:"Jost",sans-serif;font-size:.85em;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
/* ---------- sections ---------- */
#vtrip .vt-sec{margin:0 0 26px}
#vtrip .vt-sech{display:flex;align-items:center;gap:12px;margin:0 0 12px}
#vtrip .vt-sech .ic{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
#vtrip .vt-sech .ic svg{width:18px;height:18px}
#vtrip .vt-sech h3{font-family:"Syne",sans-serif;font-weight:700;font-size:1.25em}
#vtrip .vt-sech .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
#vtrip .vt-sech .lbl{white-space:nowrap}
#vtrip .vt-feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#vtrip .vt-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,transform .15s}
#vtrip .vt-card:hover{border-color:var(--line2);transform:translateY(-1px)}
#vtrip .vt-card.dim{opacity:.55}
#vtrip .vt-card.sel{border-color:var(--mustard);box-shadow:0 0 0 1px var(--mustard)}
#vtrip .vt-card .row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#vtrip .vt-num{display:inline-flex;min-width:30px;height:30px;padding:0 6px;border-radius:9px;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:.85em;color:#140F0A;background:linear-gradient(135deg,#E9AE45,#D9693A)}
#vtrip .vt-num.drive{background:var(--dusty)} #vtrip .vt-num.none{background:var(--card2);color:var(--muted);border:1px solid var(--line2)}
#vtrip .vt-time{font-family:"IBM Plex Mono",monospace;font-size:.72em;color:var(--mustard)}
#vtrip .vt-type{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:.62em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
#vtrip .vt-type svg{width:12px;height:12px}
#vtrip .vt-card h4{font-weight:600;font-size:1.01em;margin:0 0 4px;line-height:1.25}
#vtrip .vt-card p{margin:0 0 10px;color:var(--muted);font-size:.9em;line-height:1.4}
#vtrip .vt-chips{display:flex;flex-wrap:wrap;gap:6px}
#vtrip .vt-chip{font-family:"IBM Plex Mono",monospace;font-size:.64em;padding:3px 8px;border-radius:7px;background:rgba(140,176,194,.1);color:var(--dusty);white-space:nowrap}
#vtrip .vt-chip.w{background:rgba(233,174,69,.12);color:var(--mustard)} #vtrip .vt-chip.bad{background:rgba(255,127,97,.12);color:var(--bad)} #vtrip .vt-chip.grey{background:rgba(142,154,166,.12);color:var(--muted)}
/* ---------- detail sheet ---------- */
#vtrip .vt-detail{grid-column:1/-1;background:var(--bg1);border:1px solid rgba(233,174,69,.35);border-radius:18px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
#vtrip .vt-block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
#vtrip .vt-block h5{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-family:"Syne",sans-serif;font-weight:700;font-size:.95em;color:var(--text)}
#vtrip .vt-block h5 svg{width:15px;height:15px}
#vtrip .vt-kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:.9em}
#vtrip .vt-kv:first-of-type{border-top:0}
#vtrip .vt-kv span{color:var(--muted);flex:0 0 auto}
#vtrip .vt-kv b{font-weight:500;text-align:right;color:#E6DCCB}
#vtrip .vt-kv a,#vtrip .leaflet-popup-content a{color:var(--mustard)}
#vtrip .vt-diff{display:inline-flex;gap:3px;vertical-align:middle}
#vtrip .vt-diff i{width:8px;height:8px;border-radius:2px;background:var(--line2)} #vtrip .vt-diff i.on{background:var(--mustard)}
#vtrip .vt-empty{padding:26px;text-align:center;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:.8em;grid-column:1/-1;border:1px dashed var(--line2);border-radius:16px}
/* ---------- tables / guide ---------- */
#vtrip .vt-tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
#vtrip table{border-collapse:collapse;width:100%;min-width:760px;font-size:.92em;margin:0}
#vtrip th,#vtrip td{padding:11px 14px;text-align:left;vertical-align:top;border:0;border-bottom:1px solid var(--line);color:#DCD2C2;font-family:inherit}
#vtrip th{font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:.66em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--bg1)}
#vtrip td.m{font-family:"IBM Plex Mono",monospace;color:var(--mustard);white-space:nowrap}
#vtrip .vt-gsec{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
#vtrip .vt-gsec .vt-block dt{font-family:"IBM Plex Mono",monospace;font-size:.76em;color:var(--mustard);margin-top:10px}
#vtrip .vt-gsec .vt-block dd{margin:2px 0 0;color:var(--muted);font-size:.9em}
#vtrip .vt-foot{margin-top:30px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:.66em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
/* ---------- leaflet ---------- */
#vtrip .vt-lbl{background:none;border:0}
#vtrip .vt-lbl span{display:flex;width:26px;height:26px;border-radius:8px;align-items:center;justify-content:center;color:#140F0A;font:500 12px "IBM Plex Mono",monospace;border:1.5px solid #0E1319;box-shadow:0 0 12px rgba(233,174,69,.55)}
#vtrip .leaflet-popup-content-wrapper,#vtrip .leaflet-popup-tip{background:#18212B;color:#ECE2D2;border:1px solid rgba(233,174,69,.35);border-radius:12px}
#vtrip .leaflet-popup-content{font-family:"Jost",sans-serif;font-size:14px;margin:10px 12px}
#vtrip .leaflet-control-layers{border-radius:12px;border:1px solid var(--line2);background:rgba(20,27,35,.94);color:var(--text);font-family:"Jost",sans-serif;font-size:12px}
#vtrip .leaflet-control-layers-expanded{padding:8px 12px}
#vtrip .leaflet-bar a{background:#18212B;color:#ECE2D2;border-color:rgba(236,226,210,.12)}
#vtrip :focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#vtrip .vt-card{transition:none}}
@media (max-width:860px){
  #vtrip{padding:18px 12px 34px}
  #vtrip .vt-hero{grid-template-columns:1fr;gap:16px}
  #vtrip .vt-avatar{width:104px;height:104px}
  #vtrip .vt-title{font-size:2.3em}
  #vtrip .vt-stats{gap:18px}
  #vtrip .vt-top{grid-template-columns:1fr}
  #vtrip .vt-feed{grid-template-columns:1fr}
  #vtrip .vt-map{height:340px}
  #vtrip .vt-tools{margin-left:0;width:100%}
}
</style>

  (function tryNext(i){ if(i>=paths.length) return;

function snapshot(d,W,H){

  var y0=Math.min.apply(null,ext.map(function(p){return p[1]})),y1=Math.max.apply(null,ext.map(function(p){return p[1]}));
  var w=(x1-x0)*1.18+2000,h=(y1-y0)*1.18+2000,cx=(x0+x1)/2,cy=(y0+y1)/2; if(w/h>W/H) h=w*H/W; else w=h*W/H;
  var bb=[cx-w/2,cy-h/2,cx+w/2,cy+h/2];
